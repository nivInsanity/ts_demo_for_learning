name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      # The type checker is the first gate. Several exercises are graded
      # purely by whether this step passes.
      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Tests
        run: npm test
        continue-on-error: true

      # Always runs, always prints the table, never fails the build.
      # A red X on an exercise repo is demoralising and tells you nothing
      # you did not already know - the percentage is the useful signal.
      - name: Progress report
        run: npm run progress
